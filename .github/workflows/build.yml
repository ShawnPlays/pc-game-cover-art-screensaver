name: Build

# Runs on every push and pull request. Pushing a tag like v1.0.0 also publishes a GitHub Release
# with the installer, .scr, .pext and Playnite's installer.yaml attached.
#
# Optional extras, switched on by adding repository secrets (Settings → Secrets and variables → Actions):
#   Code signing (Azure Artifact Signing, formerly Trusted Signing):
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE
#   Publishing each release to winget:  WINGET_TOKEN
# Without them those steps are skipped. See docs/GUIDE.md, "Publishing".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

env:
  SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
  WINGET_ENABLED: ${{ secrets.WINGET_TOKEN != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test and build the screensaver and add-on
        shell: pwsh
        run: ./scripts/build-release.ps1 -NoInstaller

      # Sign the screensaver before it goes into the installer, so the installed copy is signed too.
      - name: Sign the screensaver
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\PCGameCoverArt.scr
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./scripts/build-installer.ps1

      - name: Sign the installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-game-cover-art
          path: dist/*

      # "What's new" comes from the README's "#### Notes for version x.y.z" section; see scripts/release-notes.ps1.
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/release-notes.ps1 -OutFile release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true   # the list of changes is added below this text

      # Opens a pull request on microsoft/winget-pkgs for the new version. Needs the package to be in winget already
      # (the first version is submitted by hand) and a token from the account that owns a fork of winget-pkgs.
      - name: Publish to winget
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_ENABLED == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ShawnPlays.PCGameCoverArt
          installers-regex: 'PCGameCoverArtSetup_.*\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
