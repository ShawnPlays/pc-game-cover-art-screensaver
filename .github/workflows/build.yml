name: Build

# Runs on every push and pull request. Pushing a tag like v1.0.0 also publishes a GitHub Release
# with the installer, .scr, .pext and Playnite's installer.yaml attached.
#
# Optional extras, switched on by adding repository secrets and variables
# (Settings → Secrets and variables → Actions):
#   Code signing with SignPath (free for open source, signed by SignPath Foundation), on releases only:
#     secret SIGNPATH_API_TOKEN; variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
#     Each release waits for an approver to approve two signing requests in SignPath (screensaver, then installer).
#   Publishing each release to winget:  secret WINGET_TOKEN
# Without them those steps are skipped. See docs/GUIDE.md, "Publishing".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases
  actions: read     # lets SignPath fetch the unsigned files from this run

env:
  SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
  WINGET_ENABLED: ${{ secrets.WINGET_TOKEN != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test and build the screensaver and add-on
        shell: pwsh
        run: ./scripts/build-release.ps1 -NoInstaller

      - name: Release version
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Sign the screensaver before it goes into the installer, so the installed copy is signed too.
      # SignPath signs what this run uploads, and checks it's built from this repository by this workflow.
      - name: Upload the screensaver for signing
        if: env.SIGN == 'true'
        id: unsigned-scr
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-screensaver
          path: dist/PCGameCoverArt.scr

      - name: Sign the screensaver (approve it in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: screensaver
          github-artifact-id: ${{ steps.unsigned-scr.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.number }}"
          wait-for-completion-timeout-in-seconds: 3600   # time for you to approve it
          output-artifact-directory: signed/screensaver

      - name: Use the signed screensaver
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed/screensaver/PCGameCoverArt.scr dist/PCGameCoverArt.scr -Force

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./scripts/build-installer.ps1

      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/PCGameCoverArtSetup_*.exe

      - name: Sign the installer (approve it in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.number }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer

      - name: Use the signed installer, and check both signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/installer/*.exe dist/ -Force
          foreach ($file in Get-ChildItem dist -Include *.scr, *.exe -Recurse) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status), signed by $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) isn't validly signed" }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-game-cover-art
          path: dist/*

      # "What's new" comes from the README's "#### Notes for version x.y.z" section; see scripts/release-notes.ps1.
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/release-notes.ps1 -OutFile release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true   # the list of changes is added below this text

      # Opens a pull request on microsoft/winget-pkgs for the new version. Needs the package to be in winget already
      # (the first version is submitted by hand) and a token from the account that owns a fork of winget-pkgs.
      - name: Publish to winget
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_ENABLED == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ShawnPlays.PCGameCoverArt
          installers-regex: 'PCGameCoverArtSetup_.*\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
