name: Build

# Runs on every push and pull request. Pushing a tag like v1.0.0 also publishes a GitHub Release
# with the .scr and .pext attached, so users can download them from the Releases page.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test and build release files
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-game-cover-art
          path: dist/*

      # "What's new" comes from the README's "#### Notes for version x.y.z" section; see scripts/release-notes.ps1.
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/release-notes.ps1 -OutFile release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true   # the list of changes is added below this text
